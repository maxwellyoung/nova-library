name: Nova
author: Maxwell Young
version: 0.1
summary: A calm controller-first library, with Home, a searchable index, consoles and collections.
description:
  A matte surface. Covers keep their own shape and carry the colour,
  focus is a plain edge, and games without art get their title on a flat slab.
  Play only appears for games with a local route that the catalogue export saw on
  this device. Details explain where each copy was seen and what is unknown.
  Kept games, focus and appearance are saved in this theme's memory.
keywords: minimal, handheld, personal
